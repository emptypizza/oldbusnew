<svg xmlns="http://www.w3.org/2000/svg" width="820" height="570" viewBox="0 0 820 570" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">다음 정거장으로 향하는 오래된 버스</title>
  <desc id="desc">순환하는 노선 위에 놓인 녹색 빈티지 버스. 오래된 차체 주위에 작은 정거장과 새잎이 어우러져 버스의 다음 생애를 표현한다.</desc>
